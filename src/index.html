<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Offline PM</title>
<style>/*__CSS__*/</style>
</head>
<body>
<header class="top">
  <div class="brand">Offline PM</div>
  <div class="menuwrap">
    <button id="projBtn" class="projbtn" aria-haspopup="menu"><span id="projName">…</span> ▾</button>
    <div id="projMenu" class="menu" hidden></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="plan">Plan</button>
    <button class="tab" data-view="risks">Risks <span id="riskGapCount" class="badge" hidden title="Risks with gaps"></span></button>
    <button class="tab" data-view="raci">RACI matrix</button>
    <button class="tab" data-view="people">People &amp; teams</button>
    <button class="tab" data-view="issues">Issues <span id="issueBadge" class="badge" hidden></span></button>
  </nav>
  <div class="spacer"></div>
  <button id="undoBtn" class="icon" title="Undo (Ctrl+Z)">↶</button>
  <button id="redoBtn" class="icon" title="Redo (Ctrl+Y)">↷</button>
  <button id="savePill" class="pill" title="Save status. Click for the save log">…</button>
  <div class="menuwrap">
    <button id="fileBtn" aria-haspopup="menu">File ▾</button>
    <div id="fileMenu" class="menu right" hidden>
      <button data-act="new">New plan file…</button>
      <button data-act="open">Open plan file…</button>
      <button data-act="copy">Save a copy as…</button>
      <button data-act="backups">Recover replaced copies…</button>
      <button data-act="reconnect" id="mReconnect" hidden>Reconnect to file</button>
      <hr>
      <button data-act="import">Import from Excel / CSV…</button>
      <button data-act="riskImport">Import risks from Excel / CSV…</button>
      <button data-act="xlsx">Export to Excel (.xlsx)</button>
      <button data-act="csv">Export tasks (.csv)</button>
      <hr>
      <button data-act="print">Print / save as PDF…</button>
      <button data-act="warnIcons" id="mWarnIcons">Hide warning icons</button>
      <button data-act="help">Help &amp; shortcuts</button>
    </div>
  </div>
</header>
<div id="roBanner" class="ro-banner" hidden role="status"><span id="roText"></span> <button id="roTake">Take over editing here</button></div>

<main id="views">
  <section id="view-plan" class="view">
    <div class="toolbar">
      <div class="grp">
        <button id="addTaskBtn" class="primary" title="New task below (Insert). With the record open, the new record opens">＋ Task</button>
        <button id="addSubBtn" title="New subtask (Ctrl+Insert)">＋ Subtask</button>
        <button id="addMsBtn" title="New milestone">◆ Milestone</button>
        <button id="pasteBtn" title="Paste a column copied from Excel into the selected cell (or click a cell and press Ctrl+V)"><span class="ico">📋</span> Paste</button>
      </div>
      <div class="grp">
        <button id="outdentBtn" class="icon" title="Outdent the selected rows (Alt+Shift+←). Shift+click selects a block">⇤</button>
        <button id="indentBtn" class="icon" title="Indent the selected rows (Alt+Shift+→). Shift+click selects a block">⇥</button>
        <button id="upBtn" class="icon" title="Move up (Alt+Shift+↑)">↑</button>
        <button id="downBtn" class="icon" title="Move down (Alt+Shift+↓)">↓</button>
        <button id="delBtn" class="icon" title="Delete the selected rows (Delete)"><span class="ico">🗑</span></button>
        <span id="selCount" class="hint" hidden></span>
      </div>
      <div class="grp">
        <select id="levelSel" title="Show outline levels">
          <option value="">Expand…</option><option value="all">Expand all</option>
          <option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option>
        </select>
        <input id="searchBox" type="search" placeholder="Filter tasks…" size="14">
        <select id="personFilter" title="Show tasks for a person or team"><option value="">Everyone</option></select>
      </div>
      <div class="spacer"></div>
      <div class="grp">
        <button id="detailsBtn" title="Open the record form for the selected task (Ctrl+I)"><span class="ico">📄</span> Record</button>
      </div>
      <div class="grp seg" id="grainSeg">
        <button data-grain="day">Day</button><button data-grain="week" class="on">Week</button>
        <button data-grain="month">Month</button><button data-grain="quarter">Quarter</button>
        <button data-grain="fit" title="Fit whole project">Fit</button>
      </div>
      <button id="todayBtn" title="Scroll to today">Today</button>
    </div>
    <div class="split" id="split">
      <section id="formPane" class="form-pane" aria-hidden="true"></section>
      <div class="grid-pane" id="gridPane">
        <div class="grid-head" id="gridHead"></div>
        <div class="grid-body" id="gridBody" tabindex="0" role="treegrid" aria-label="Plan outline" aria-readonly="false"><div class="grid-canvas" id="gridCanvas"><div id="gridRows"></div></div></div>
      </div>
      <div class="splitter" id="splitter" title="Drag to resize"></div>
      <div class="gantt-pane" id="ganttPane">
        <div class="gantt-head" id="ganttHead"><svg id="ganttHeadSvg"></svg></div>
        <div class="gantt-body" id="ganttBody"><svg id="ganttSvg"></svg></div>
      </div>
    </div>
  </section>

  <section id="view-risks" class="view" hidden>
    <div class="toolbar">
      <div class="grp"><button id="addRiskBtn" class="primary" title="New risk">＋ Risk</button></div>
      <div class="grp seg" id="riskSeg"><button data-f="all" class="on">All</button><button data-f="gaps" title="Risks with something not covered">Gaps</button></div>
      <div class="grp"><input id="riskSearch" type="search" placeholder="Filter risks…" size="16"></div>
      <div class="spacer"></div>
      <div class="grp"><button id="riskImportBtn">Import risks…</button><button id="closeoutBtn">Closeout report</button></div>
    </div>
    <div class="split" id="riskSplit">
      <section id="riskFormPane" class="form-pane" aria-hidden="true"></section>
      <div class="rk-pane" id="riskBody"></div>
      <div class="rp-pane">
        <div class="rp-head"><b>Plan</b><input id="planSearch" type="search" placeholder="Find task…"></div>
        <div class="rp-list" id="riskPlanList"></div>
      </div>
    </div>
  </section>

  <section id="view-raci" class="view" hidden>
    <div class="toolbar">
      <div class="grp seg" id="raciBySeg"><button data-by="team">By team</button><button data-by="person">By person</button></div>
      <div class="grp"><label><input type="checkbox" id="raciOnlyUsed" checked> Only people/teams with assignments</label></div>
      <div class="grp"><label><input type="checkbox" id="raciLeaves"> Hide summary tasks</label></div>
      <div class="spacer"></div>
      <span class="hint" id="raciHint"></span>
    </div>
    <div class="split" id="raciSplit"><div class="raci-wrap" id="raciWrap"></div></div>
  </section>

  <section id="view-people" class="view" hidden>
    <div class="people-cols">
      <div class="card">
        <div class="card-h"><h2>People</h2><button id="addPersonBtn" class="primary" title="Add a row; paste a column of names into it to add many">＋ Person</button></div>
        <div id="peopleList"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Teams</h2><button id="addTeamBtn" class="primary">＋ Team</button></div>
        <div id="teamList"></div>
      </div>
    </div>
  </section>

  <section id="view-issues" class="view" hidden>
    <div class="toolbar">
      <div class="grp seg" id="issueSeg"><button data-f="all" class="on">All</button><button data-f="warn">Warnings</button><button data-f="raci">RACI</button><button data-f="dep">Dependencies</button><button data-f="dates">Dates</button></div>
    </div>
    <div id="issueList" class="issue-list"></div>
  </section>
</main>

<div id="logPanel" class="logpanel" hidden>
  <div class="card-h"><h3>Save log</h3><label class="hint"><input type="checkbox" id="slowMo"> Slow-motion saves</label><button id="logClose" class="icon">✕</button></div>
  <div class="lanes">
    <div class="lane"><span>Browser crash buffer</span><b id="laneMirror">–</b></div>
    <div class="lane"><span id="laneDiskName">Plan file</span><b id="laneDisk">–</b></div>
  </div>
  <ol id="logList"></ol>
</div>
<div id="modalBack" class="modal-back" hidden><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></div></div>
<div id="pop" class="pop" hidden></div>
<div id="dragTip" class="dragtip" hidden></div>
<div id="printRoot" class="print-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>/*__SQLJS__*/</script>
<script>/*__XLSX__*/</script>
<script>const WASM_B64 = "__WASM_B64__";</script>

</body>
</html>
